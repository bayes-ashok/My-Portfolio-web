<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dowry Estimator Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <!-- Include jsPDF library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dowry Estimator Pro</h1>
            <div class="crystal-ball" id="crystalBall"></div>
        </header>
        
        <div class="form-card">
            <form id="dowryForm">
                <section class="input-section">
                    <h2>Groom Profile</h2>
                    <div class="input-group">
                        <select id="groomEdu" required>
                            <option value="">Education</option>
                            <option value="none">None</option>
                            <option value="highschool">High School</option>
                            <option value="diploma">Diploma</option>
                            <option value="bachelor">Bachelor’s</option>
                            <option value="master">Master’s</option>
                            <option value="phd">PhD</option>
                        </select>
                        <select id="groomJob" required>
                            <option value="">Job Type</option>
                            <option value="none">Unemployed</option>
                            <option value="labor">Labor/Entry-Level</option>
                            <option value="private">Private Job</option>
                            <option value="professional">Business/Professional</option>
                            <option value="govt">Government Job</option>

                        </select>
                        <select id="groomIncome" required>
                            <option value="">Annual Income</option>
                            <option value="none">No Income</option>
                            <option value="below5">Below ₨5L</option>
                            <option value="5to10">₨5L - ₨10L</option>
                            <option value="10to20">₨10L - ₨20L</option>
                            <option value="20to50">₨20L - ₨50L</option>
                            <option value="above50">Above ₨50L</option>
                        </select>
                        <input type="number" id="groomAge" placeholder="Age" required>
                        <div class="land-input">
                            <input type="number" id="landAmount" placeholder="Land Amount" step="0.1">
                            <select id="landUnit">
                                <option value="acres">Acres</option>
                                <option value="hectares">Hectares</option>
                                <option value="sqkm">Square Kilometers</option>
                                <option value="bigha">Bigha</option>
                            </select>
                        </div>
                        <select id="otherAssets">
                            <option value="none">Other Assets</option>
                            <option value="none">None</option>
                            <option value="some">Some (e.g., Car, Savings)</option>
                            <option value="significant">Significant (e.g., Investments)</option>
                        </select>
                        <div class="toggle-container">
                            <label class="toggle-label">Owns House</label>
                            <label class="toggle-switch">
                                <input type="checkbox" id="house">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </section>

                <section class="input-section">
                    <h2>Bride Profile</h2>
                    <div class="input-group bride-group">
                        <input type="number" id="brideAge" placeholder="Age" required>
                        <select id="brideEdu">
                            <option value="">Education</option>
                            <option value="none">None</option>
                            <option value="highschool">High School</option>
                            <option value="diploma">Diploma</option>
                            <option value="bachelor">Bachelor’s</option>
                            <option value="master">Master’s</option>
                            <option value="phd">PhD</option>
                        </select>
                        <select id="brideJob">
                            <option value="">Job Type</option>
                            <option value="none">Unemployed</option>
                            <option value="labor">Labor/Entry-Level</option>
                            <option value="private">Private Job</option>
                            <option value="professional">Business/Professional</option>
                            <option value="govt">Government Job</option>
                        </select>
                        <select id="brideIncome">
                            <option value="none">Annual Income</option>
                            <option value="below5">Below ₨5L</option>
                            <option value="5to10">₨5L - ₨10L</option>
                            <option value="10to20">₨10L - ₨20L</option>
                            <option value="above20">Above ₨20L</option>
                        </select>
                    </div>
                </section>

                <button type="submit" class="submit-btn">Estimate Dowry</button>
            </form>
        </div>

        <div id="result" class="result-card hidden"></div>
        <!-- Download PDF Button -->
        <button id="downloadPdfBtn" class="submit-btn hidden">Download Report as PDF</button>

        <!-- Modal for Bride and Groom Names -->
        <div id="nameModal" class="modal hidden">
            <div class="modal-content">
                <h3>Enter Bride and Groom Names</h3>
                <form id="nameForm">
                    <input type="text" id="brideName" placeholder="Bride's Full Name" required>
                    <input type="text" id="groomName" placeholder="Groom's Full Name" required>
                    <button type="submit" class="submit-btn">Generate PDF</button>
                    <button type="button" id="closeModal" class="submit-btn">Cancel</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
