<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Forever</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="fade-in">ANGEL, My Love,</h1>
        <p class="fade-in delay-1">You are my dawn, my dusk, my every heartbeat. Will you be mine, now and always?</p>
        <div class="proposal-buttons fade-in delay-2">
            <button id="yes-btn">Yes, My Love</button>
            <button id="no-btn">No (Please Don’t!)</button>
        </div>
        <div id="confetti" class="hidden"></div>
    </div>
    <div id="hearts"></div>
    <script src="script.js"></script>
</body>
</html>
