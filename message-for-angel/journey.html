<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Love Check</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="fade-in">Do You Feel Our Love?</h1>
      <p class="fade-in delay-1">Let’s see how our love aligns...</p>
      <div id="quiz">
        <div class="quiz-question">
          <p>Which is the series that we both love the most?</p>
          <button onclick="checkAnswer('xx', this, 0)">
            A. Broken but Beautiful
          </button>
          <button onclick="checkAnswer('Crushed', this, 0)">
            B. Crushed
          </button>
          <button onclick="checkAnswer('x', this, 0)">
            C. Mismatched
          </button>
        </div>
        <div class="quiz-question hidden">
            <p>What was the color of the first ever bouquet you received from me?</p>
            <button onclick="checkAnswer('Black', this, 1)">
              A. Black
            </button>
            <button onclick="checkAnswer('xx', this, 1)">
              B. Red
            </button>
            <button onclick="checkAnswer('xx', this, 1)">
              C. White
            </button>
        </div>
        <div class="quiz-question hidden">
            <p>What’s my best memory about us?</p>
            <button onclick="checkAnswer('xx', this, 2)">
              A. A late-night walk
            </button>
            <button onclick="checkAnswer('star', this, 2)">
              B. Mid-night star gazing under the sky
            </button>
            <button onclick="checkAnswer('xx', this, 2)">
              C. Having momo together
            </button>
        </div>
      </div>
      <p id="quiz-result" class="hidden">
        Our hearts beat as one! <a href="letter.html">A Gift Awaits</a>
      </p>
    </div>
    <div id="hearts"></div>
    <script src="script.js"></script>
  </body>
</html>
