<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON VOID</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            color: white;
            height: 100%;
            width: 100%;
            touch-action: none;
        }

        /* ── LANDING ── */
        #landing {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1a0033 0%, #0a0a0a 70%);
            z-index: 1000;
            cursor: pointer;
            padding: clamp(1rem, 5vw, 3rem);
            text-align: center;
        }

        #landing::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, transparent 49%, rgba(255,0,255,0.04) 50%, transparent 51%),
                linear-gradient(transparent 49%, rgba(0,255,255,0.04) 50%, transparent 51%);
            background-size: 80px 80px;
            animation: gridMove 15s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0%   { background-position: 0 0; }
            100% { background-position: 80px 80px; }
        }

        .glow-text {
            font-size: clamp(2.2rem, 10vw, 6rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: clamp(0.15em, 2vw, 0.35em);
            text-shadow:
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink),
                0 0 80px var(--neon-blue),
                0 0 120px #ff00ff;
            margin-bottom: clamp(1.5rem, 5vh, 3rem);
            animation: titlePulse 1.6s ease-in-out infinite;
            line-height: 1.1;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.04); }
        }

        #start-btn {
            padding: clamp(1rem, 3vh, 1.8rem) clamp(2.5rem, 8vw, 5.5rem);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.1rem, 4vw, 2.4rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: clamp(0.1em, 1vw, 0.25em);
            background: transparent;
            color: white;
            border: clamp(3px, 0.5vw, 5px) solid var(--neon-pink);
            cursor: pointer;
            box-shadow:
                0 0 40px var(--neon-pink),
                0 0 90px rgba(255,0,255,0.7);
            transition: all 0.15s ease;
            position: relative;
            z-index: 1;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        #start-btn:hover,
        #start-btn:focus-visible {
            background: rgba(255, 0, 255, 0.25);
            transform: scale(1.12);
            box-shadow:
                0 0 70px var(--neon-pink),
                0 0 160px var(--neon-blue);
            outline: none;
        }

        #start-btn:active {
            transform: scale(0.97);
        }

        #sound-note {
            margin-top: clamp(1.5rem, 4vh, 4rem);
            font-size: clamp(0.6rem, 2.5vw, 1.1rem);
            opacity: 0.85;
            letter-spacing: clamp(0.1em, 1vw, 0.2em);
            text-shadow: 0 0 20px var(--neon-blue);
            max-width: 90vw;
            line-height: 1.5;
        }

        /* ── DISCO ── */
        #disco {
            position: fixed;
            inset: 0;
            display: none;
            overflow: hidden;
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, #120033, #220022, #001122);
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Flash overlay for extreme strobe effect */
        #flash-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            background: white;
            z-index: 10;
        }


    </style>
</head>
<body>

    <!-- LANDING -->
    <div id="landing">
        <div class="glow-text">NEON VOID</div>
        <button id="start-btn">GET STARTED</button>
        <div id="sound-note">🔊 TURN ON FULL SOUND FOR A BETTER EXPERIENCE</div>
    </div>

    <!-- DISCO -->
    <div id="disco">
        <div class="bg-layer"></div>
        <canvas id="canvas"></canvas>
        <div id="flash-overlay"></div>
    </div>


    <script>
        const landing        = document.getElementById('landing');
        const disco          = document.getElementById('disco');
        const startBtn       = document.getElementById('start-btn');
        const canvas         = document.getElementById('canvas');
        const ctx            = canvas.getContext('2d');
        const flashOverlay   = document.getElementById('flash-overlay');

        let particles       = [];
        let time            = 0;
        let started         = false;

        /* ═══════════════════════════════════════════════════════════════════════
         *  BULLETPROOF MOBILE AUDIO ENGINE
         *
         *  Problem with all previous approaches:
         *  ─ <audio>.play()   : async pipeline check on iOS breaks gesture token
         *  ─ fetch().then()   : buffer may not be ready at tap time; Promise chain
         *                       breaks gesture token even if data is cached
         *  ─ AudioContext created before gesture but buffer decoded via fetch/Promise:
         *    decodeAudioData callback is a microtask — gesture token is gone by then
         *
         *  This implementation:
         *  1. XHR preloads the raw ArrayBuffer synchronously-as-possible (XHR is more
         *     reliable than fetch() inside iOS WKWebView and older Android WebViews)
         *  2. Inside the gesture handler — BEFORE anything else — we:
         *     a. Create a NEW AudioContext (creation inside gesture = always unlocked)
         *     b. Play a 1-sample silent buffer immediately (classic iOS unlock trick —
         *        stamps the context as "user activated" on older Safari versions)
         *     c. If audioBuffer is already decoded: start all 5 nodes immediately
         *     d. If not yet decoded (slow connection): decode synchronously from the
         *        cached XHR ArrayBuffer, then start — no extra gesture needed because
         *        we are still inside the original synchronous call stack
         *  3. pointerdown is the primary trigger — it fires 50-300ms earlier than
         *     click on mobile and is the earliest possible gesture signal
         *  4. Zero promises, zero awaits, zero setTimeout between tap and play()
         * ═══════════════════════════════════════════════════════════════════════ */

        const AUDIO_SRC      = 'music.mp3';
        const OFFSETS        = [0, 1, 2, 3, 4];
        const INSTANCE_COUNT = OFFSETS.length;

        // XHR raw bytes — loaded at page start, gesture-free
        let xhrBuffer   = null;   // ArrayBuffer from XHR
        let audioBuffer = null;   // decoded AudioBuffer (set when XHR + decode completes)
        let audioCtx    = null;   // created INSIDE gesture for guaranteed unlock

        // ── XHR preload (starts immediately, no gesture needed for network I/O) ──
        (function xhrPreload() {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', AUDIO_SRC, true);
            xhr.responseType = 'arraybuffer';
            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    xhrBuffer = xhr.response;
                    // Pre-decode into a temporary context so it's ready at tap time.
                    // If this finishes before the tap, audioBuffer will be set and
                    // we skip the in-gesture decode entirely (fastest path).
                    try {
                        const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                        // slice() clones the buffer — decodeAudioData consumes its input
                        tempCtx.decodeAudioData(xhrBuffer.slice(0), function(decoded) {
                            audioBuffer = decoded;
                            tempCtx.close();
                            console.log('[Audio] Pre-decoded OK, duration:', decoded.duration.toFixed(2) + 's');
                        }, function(err) {
                            console.warn('[Audio] Pre-decode failed, will decode at gesture time:', err);
                        });
                    } catch(e) {
                        console.warn('[Audio] Temp context failed:', e);
                    }
                } else {
                    console.warn('[Audio] XHR failed, status:', xhr.status);
                }
            };
            xhr.onerror = function() { console.warn('[Audio] XHR network error'); };
            xhr.send();
        })();

        // ── Unlock + play — called synchronously from pointerdown ──────────────
        function unlockAndPlay() {
            // 1. Create AudioContext INSIDE the gesture — this is the key unlock on iOS.
            //    A context created inside a user gesture is immediately in "running" state
            //    on all browsers, including iOS Safari 9–17. No .resume() needed.
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch(e) {
                console.error('[Audio] AudioContext creation failed:', e);
                return;
            }

            // 2. iOS silent-buffer unlock (belt-and-suspenders for Safari < 13).
            //    Play a single frame of silence synchronously — this "activates" the
            //    audio hardware on devices that need it before real audio will play.
            try {
                const silentBuf = audioCtx.createBuffer(1, 1, 22050);
                const silentSrc = audioCtx.createBufferSource();
                silentSrc.buffer = silentBuf;
                silentSrc.connect(audioCtx.destination);
                silentSrc.start(0);
                silentSrc.stop(audioCtx.currentTime + 0.001);
            } catch(e) { /* non-fatal */ }

            // 3. Now start the real audio — still inside the same synchronous call stack
            if (audioBuffer) {
                // Fast path: buffer was decoded before the tap
                spawnAllNodes(audioBuffer);
            } else if (xhrBuffer) {
                // Slow-connection path: XHR data arrived but decode hadn't finished yet.
                // decodeAudioData with callback (not Promise) — the callback fires async,
                // BUT the context is already unlocked from step 1 so it will play fine.
                console.log('[Audio] Buffer not pre-decoded, decoding now from XHR data...');
                try {
                    audioCtx.decodeAudioData(xhrBuffer.slice(0), function(decoded) {
                        audioBuffer = decoded;
                        spawnAllNodes(decoded);
                    }, function(err) {
                        console.error('[Audio] decodeAudioData failed:', err);
                    });
                } catch(e) {
                    console.error('[Audio] decodeAudioData threw:', e);
                }
            } else {
                // No data at all yet — XHR still in flight.
                // Attach a one-shot handler to XHR completion to play when data arrives.
                // Context is already unlocked so playback will work.
                console.warn('[Audio] XHR still in flight at gesture time — will play on arrival');
                const interval = setInterval(function() {
                    if (audioBuffer) {
                        clearInterval(interval);
                        spawnAllNodes(audioBuffer);
                    } else if (xhrBuffer) {
                        clearInterval(interval);
                        audioCtx.decodeAudioData(xhrBuffer.slice(0), function(decoded) {
                            audioBuffer = decoded;
                            spawnAllNodes(decoded);
                        }, function(e) { console.error('[Audio] Late decode failed:', e); });
                    }
                }, 50);
            }
        }

        // ── Spawn all 5 looping source nodes from a decoded AudioBuffer ─────────
        function spawnAllNodes(buf) {
            const duration = buf.duration;
            for (let i = 0; i < INSTANCE_COUNT; i++) {
                try {
                    const source     = audioCtx.createBufferSource();
                    source.buffer    = buf;
                    source.loop      = true;
                    source.loopStart = 0;
                    source.loopEnd   = duration;
                    source.connect(audioCtx.destination);
                    // start(when=0, offset) — synchronous, immediate, no Promise
                    source.start(0, OFFSETS[i] % duration);
                    console.log('[Audio] Node', i, 'started at offset', OFFSETS[i] % duration, 's');
                } catch(e) {
                    console.error('[Audio] Node', i, 'failed to start:', e);
                }
            }
        }

        /* ── Canvas sizing ── */
        function resizeCanvas() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /* ── Particles ── */
        class Particle {
            constructor() { this.reset(true); }
            reset(scatter = false) {
                this.x       = scatter ? Math.random() * canvas.width  : canvas.width  / 2 + (Math.random() - 0.5) * 300;
                this.y       = scatter ? Math.random() * canvas.height * 0.7 : canvas.height / 2 + (Math.random() - 0.5) * 300;
                this.size    = Math.random() * 8 + 2;
                this.speedX  = Math.random() * 7 - 3.5;
                this.speedY  = Math.random() * 7 - 3.5;
                this.hue     = Math.random() * 360;
                this.life    = 160 + Math.random() * 60;
                this.maxLife = this.life;
            }
            update() {
                this.x    += this.speedX;
                this.y    += this.speedY;
                this.life -= 1.8;
                if (this.life <= 0) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                ctx.fillStyle   = `hsl(${(this.hue + time * 5) % 360}, 100%, 95%)`;
                ctx.shadowBlur  = 35;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 70%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 500; i++) particles.push(new Particle());
        }

        /* ── Strobe / flicker engine ── */
        let strobeIntensity = 0;
        let flashInterval   = 90;

        function triggerDOMFlash() {
            const brightness = 0.3 + strobeIntensity * 0.7;
            flashOverlay.style.opacity = brightness;
            setTimeout(() => { flashOverlay.style.opacity = 0; }, 30 + Math.random() * 40);
        }

        function scheduleStrobe() {
            if (!started) return;
            triggerDOMFlash();
            if (Math.random() < strobeIntensity * 0.6) {
                setTimeout(triggerDOMFlash, 55);
            }
            flashInterval = Math.max(22, flashInterval - 0.5);
            setTimeout(scheduleStrobe, flashInterval + Math.random() * flashInterval * 0.5);
        }

        function canvasFlash() {
            const intensity = 0.15 + strobeIntensity * 0.45 + Math.random() * 0.2;
            ctx.fillStyle   = `rgba(255,255,255,${intensity})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        /* ── Main animation loop ── */
        function animate() {
            time++;
            strobeIntensity = Math.min(1, time / 3600);

            const fade = 0.30 - strobeIntensity * 0.15;
            ctx.fillStyle = `rgba(10,3,25,${fade})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => { p.update(); p.draw(); });

            const cx    = canvas.width  / 2;
            const cy    = canvas.height / 2;
            const pulse = Math.sin(time * 0.32) * 90 + 170;
            const grad  = ctx.createRadialGradient(cx, cy, 30, cx, cy, pulse);
            grad.addColorStop(0,   'rgba(255,20,180,0.9)');
            grad.addColorStop(0.5, 'rgba(0,200,255,0.3)');
            grad.addColorStop(1,   'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
            ctx.fill();

            const arms   = 6;
            const angle0 = (time * 0.018) % (Math.PI * 2);
            for (let i = 0; i < arms; i++) {
                const a   = angle0 + (i / arms) * Math.PI * 2;
                const hue = (time * 3 + i * 60) % 360;
                ctx.save();
                ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${0.35 + strobeIntensity * 0.3})`;
                ctx.lineWidth   = 2 + strobeIntensity * 3;
                ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
                ctx.shadowBlur  = 30 + strobeIntensity * 40;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(
                    cx + Math.cos(a) * Math.max(canvas.width, canvas.height),
                    cy + Math.sin(a) * Math.max(canvas.width, canvas.height)
                );
                ctx.stroke();
                ctx.restore();
            }

            if (Math.random() < 0.45 + strobeIntensity * 0.45) canvasFlash();

            if (Math.random() < 0.4 + strobeIntensity * 0.5) {
                document.body.style.background =
                    `hsl(${Math.floor(Math.random() * 360)}, 95%, ${4 + strobeIntensity * 4}%)`;
            }

            requestAnimationFrame(animate);
        }

        /* ── Start experience ── */
        function startExperience() {
            if (started) return;
            started = true;

            // ① AUDIO UNLOCK + PLAY — absolutely first, inside the synchronous gesture call stack
            unlockAndPlay();

            // ② Fullscreen — fires async internally; audio context already unlocked above
            try { document.documentElement.requestFullscreen?.(); } catch (e) {}

            // ③ Visuals
            initParticles();
            animate();
            scheduleStrobe();

            // ④ UI swap
            landing.style.display = 'none';
            disco.style.display   = 'block';

            // ⑤ Exit blocker
            window.addEventListener('beforeunload', e => {
                e.preventDefault();
                e.returnValue = '';
            });
        }

        /* ── Event listeners ────────────────────────────────────────────────────
         *
         *  pointerdown  — primary: fires at the earliest possible moment on ALL
         *                 modern browsers (iOS Safari 13+, Android Chrome, desktop).
         *                 Crucially, it fires BEFORE the browser's 300ms click delay
         *                 on mobile, giving the gesture token maximum lifetime.
         *
         *  touchstart   — fallback for iOS Safari < 13 which lacks PointerEvents.
         *                 e.preventDefault() stops the synthetic click that fires ~300ms
         *                 later so startExperience() isn't called twice.
         *
         *  click        — final fallback for desktop-only browsers or any edge case
         *                 where neither pointer nor touch events fired.
         *
         *  All three call startExperience() which is guarded by `started` so only
         *  the first invocation does anything.
         * ───────────────────────────────────────────────────────────────────── */
        startBtn.addEventListener('pointerdown', function(e) {
            // Don't preventDefault here — that would suppress focus and click on desktop
            startExperience();
        }, { passive: true, once: true });

        startBtn.addEventListener('touchstart', function(e) {
            e.preventDefault(); // suppress the ghost click ~300ms later
            startExperience();
        }, { passive: false, once: true });

        startBtn.addEventListener('click', function(e) {
            startExperience(); // no-op if pointerdown/touchstart already fired
        }, { once: true });
    </script>
</body>
</html>
