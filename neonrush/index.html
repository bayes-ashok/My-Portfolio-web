<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON VOID</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            color: white;
            height: 100%;
            width: 100%;
            touch-action: none;
        }

        /* ── LANDING ── */
        #landing {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1a0033 0%, #0a0a0a 70%);
            z-index: 1000;
            cursor: pointer;
            padding: clamp(1rem, 5vw, 3rem);
            text-align: center;
        }

        #landing::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, transparent 49%, rgba(255,0,255,0.04) 50%, transparent 51%),
                linear-gradient(transparent 49%, rgba(0,255,255,0.04) 50%, transparent 51%);
            background-size: 80px 80px;
            animation: gridMove 15s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0%   { background-position: 0 0; }
            100% { background-position: 80px 80px; }
        }

        .glow-text {
            font-size: clamp(2.2rem, 10vw, 6rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: clamp(0.15em, 2vw, 0.35em);
            text-shadow:
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink),
                0 0 80px var(--neon-blue),
                0 0 120px #ff00ff;
            margin-bottom: clamp(1.5rem, 5vh, 3rem);
            animation: titlePulse 1.6s ease-in-out infinite;
            line-height: 1.1;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.04); }
        }

        #start-btn {
            padding: clamp(1rem, 3vh, 1.8rem) clamp(2.5rem, 8vw, 5.5rem);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.1rem, 4vw, 2.4rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: clamp(0.1em, 1vw, 0.25em);
            background: transparent;
            color: white;
            border: clamp(3px, 0.5vw, 5px) solid var(--neon-pink);
            cursor: pointer;
            box-shadow:
                0 0 40px var(--neon-pink),
                0 0 90px rgba(255,0,255,0.7);
            transition: all 0.15s ease;
            position: relative;
            z-index: 1;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        #start-btn:hover,
        #start-btn:focus-visible {
            background: rgba(255, 0, 255, 0.25);
            transform: scale(1.12);
            box-shadow:
                0 0 70px var(--neon-pink),
                0 0 160px var(--neon-blue);
            outline: none;
        }

        #start-btn:active {
            transform: scale(0.97);
        }

        #sound-note {
            margin-top: clamp(1.5rem, 4vh, 4rem);
            font-size: clamp(0.6rem, 2.5vw, 1.1rem);
            opacity: 0.85;
            letter-spacing: clamp(0.1em, 1vw, 0.2em);
            text-shadow: 0 0 20px var(--neon-blue);
            max-width: 90vw;
            line-height: 1.5;
        }

        /* ── DISCO ── */
        #disco {
            position: fixed;
            inset: 0;
            display: none;
            overflow: hidden;
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, #120033, #220022, #001122);
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Flash overlay for extreme strobe effect */
        #flash-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            background: white;
            z-index: 10;
        }


    </style>
</head>
<body>

    <!-- LANDING -->
    <div id="landing">
        <div class="glow-text">NEON VOID</div>
        <button id="start-btn">GET STARTED</button>
        <div id="sound-note">🔊 TURN ON FULL SOUND FOR A BETTER EXPERIENCE</div>
    </div>

    <!-- DISCO -->
    <div id="disco">
        <div class="bg-layer"></div>
        <canvas id="canvas"></canvas>
        <div id="flash-overlay"></div>
    </div>


    <script>
        const landing        = document.getElementById('landing');
        const disco          = document.getElementById('disco');
        const startBtn       = document.getElementById('start-btn');
        const canvas         = document.getElementById('canvas');
        const ctx            = canvas.getContext('2d');
        const flashOverlay   = document.getElementById('flash-overlay');

        let particles       = [];
        let time            = 0;
        let started         = false;

        /* ─────────────────────────────────────────────────────────────────────
         *  WEB AUDIO ENGINE
         *
         *  Why Web Audio instead of <audio> elements:
         *  - A single fetch() loads the file once into an ArrayBuffer
         *  - decodeAudioData() decodes it into an AudioBuffer in memory
         *  - AudioBufferSourceNode.start() is 100% synchronous — no Promise,
         *    no readyState check, no canplay event — so it never breaks the
         *    mobile gesture token
         *  - offset is passed directly to .start(ctx, when, offset) — no seek
         *  - Works identically on iOS Safari 14+, Android Chrome, desktop
         * ───────────────────────────────────────────────────────────────────── */
        const AUDIO_SRC      = 'music.mp3';
        const OFFSETS        = [0, 1, 2, 3, 4];   // per-instance start offsets in seconds
        const INSTANCE_COUNT = OFFSETS.length;

        let audioCtx         = null;   // created at page load (suspended on mobile until gesture)
        let audioBuffer      = null;   // decoded PCM data, ready to play
        let fetchError       = false;

        /* Create AudioContext immediately — suspended on mobile, running on desktop.
           Mobile browsers allow creation before gesture; they just won't produce sound
           until .resume() is called inside a gesture. */
        function initAudioContext() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.warn('Web Audio not supported:', e);
            }
        }
        initAudioContext();

        /* Fetch + decode in background immediately — no gesture needed for network */
        function preloadAudio() {
            if (!audioCtx) return;
            fetch(AUDIO_SRC)
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.arrayBuffer();
                })
                .then(buf => audioCtx.decodeAudioData(buf))
                .then(decoded => {
                    audioBuffer = decoded;
                    console.log('Audio buffered, duration:', decoded.duration.toFixed(2) + 's');
                })
                .catch(e => {
                    fetchError = true;
                    console.warn('Audio preload failed:', e);
                });
        }
        preloadAudio();

        /* Called synchronously inside the gesture handler.
           AudioContext.resume() + source.start() are both synchronous operations
           that mobile browsers honour within a user gesture. */
        function startAudioSync() {
            if (!audioCtx) return;

            // Resume the context (required on mobile — this IS synchronous in terms of
            // gesture-token consumption even though it returns a Promise internally)
            audioCtx.resume();

            if (!audioBuffer) {
                // File not decoded yet (very slow connection) — play silence, nothing to do
                console.warn('Audio buffer not ready at gesture time');
                return;
            }

            const duration = audioBuffer.duration;

            for (let i = 0; i < INSTANCE_COUNT; i++) {
                const offset = OFFSETS[i] % duration;  // wrap if offset > duration

                // Create a fresh source node (they are single-use by spec)
                const source      = audioCtx.createBufferSource();
                source.buffer     = audioBuffer;
                source.loop       = true;
                source.loopStart  = 0;
                source.loopEnd    = duration;

                // Connect directly to output
                source.connect(audioCtx.destination);

                // start(when, offset) — starts immediately at the given offset into the buffer
                // This is fully synchronous — no Promise, no event, no waiting
                source.start(0, offset);
            }
        }

        /* ── Canvas sizing ── */
        function resizeCanvas() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /* ── Particles ── */
        class Particle {
            constructor() { this.reset(true); }
            reset(scatter = false) {
                this.x       = scatter ? Math.random() * canvas.width  : canvas.width  / 2 + (Math.random() - 0.5) * 300;
                this.y       = scatter ? Math.random() * canvas.height * 0.7 : canvas.height / 2 + (Math.random() - 0.5) * 300;
                this.size    = Math.random() * 8 + 2;
                this.speedX  = Math.random() * 7 - 3.5;
                this.speedY  = Math.random() * 7 - 3.5;
                this.hue     = Math.random() * 360;
                this.life    = 160 + Math.random() * 60;
                this.maxLife = this.life;
            }
            update() {
                this.x    += this.speedX;
                this.y    += this.speedY;
                this.life -= 1.8;
                if (this.life <= 0) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
                ctx.fillStyle   = `hsl(${(this.hue + time * 5) % 360}, 100%, 95%)`;
                ctx.shadowBlur  = 35;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 70%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 500; i++) particles.push(new Particle());
        }

        /* ── Strobe / flicker engine ── */
        let strobeIntensity = 0;
        let flashInterval   = 90;

        function triggerDOMFlash() {
            const brightness = 0.3 + strobeIntensity * 0.7;
            flashOverlay.style.opacity = brightness;
            setTimeout(() => { flashOverlay.style.opacity = 0; }, 30 + Math.random() * 40);
        }

        function scheduleStrobe() {
            if (!started) return;
            triggerDOMFlash();
            if (Math.random() < strobeIntensity * 0.6) {
                setTimeout(triggerDOMFlash, 55);
            }
            flashInterval = Math.max(22, flashInterval - 0.5);
            setTimeout(scheduleStrobe, flashInterval + Math.random() * flashInterval * 0.5);
        }

        function canvasFlash() {
            const intensity = 0.15 + strobeIntensity * 0.45 + Math.random() * 0.2;
            ctx.fillStyle   = `rgba(255,255,255,${intensity})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        /* ── Main animation loop ── */
        function animate() {
            time++;
            strobeIntensity = Math.min(1, time / 3600);

            const fade = 0.30 - strobeIntensity * 0.15;
            ctx.fillStyle = `rgba(10,3,25,${fade})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => { p.update(); p.draw(); });

            const cx    = canvas.width  / 2;
            const cy    = canvas.height / 2;
            const pulse = Math.sin(time * 0.32) * 90 + 170;
            const grad  = ctx.createRadialGradient(cx, cy, 30, cx, cy, pulse);
            grad.addColorStop(0,   'rgba(255,20,180,0.9)');
            grad.addColorStop(0.5, 'rgba(0,200,255,0.3)');
            grad.addColorStop(1,   'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, pulse, 0, Math.PI * 2);
            ctx.fill();

            const arms   = 6;
            const angle0 = (time * 0.018) % (Math.PI * 2);
            for (let i = 0; i < arms; i++) {
                const a   = angle0 + (i / arms) * Math.PI * 2;
                const hue = (time * 3 + i * 60) % 360;
                ctx.save();
                ctx.strokeStyle = `hsla(${hue}, 100%, 70%, ${0.35 + strobeIntensity * 0.3})`;
                ctx.lineWidth   = 2 + strobeIntensity * 3;
                ctx.shadowColor = `hsl(${hue}, 100%, 60%)`;
                ctx.shadowBlur  = 30 + strobeIntensity * 40;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(
                    cx + Math.cos(a) * Math.max(canvas.width, canvas.height),
                    cy + Math.sin(a) * Math.max(canvas.width, canvas.height)
                );
                ctx.stroke();
                ctx.restore();
            }

            if (Math.random() < 0.45 + strobeIntensity * 0.45) canvasFlash();

            if (Math.random() < 0.4 + strobeIntensity * 0.5) {
                document.body.style.background =
                    `hsl(${Math.floor(Math.random() * 360)}, 95%, ${4 + strobeIntensity * 4}%)`;
            }

            requestAnimationFrame(animate);
        }

        /* ── Start experience ── */
        function startExperience() {
            if (started) return;
            started = true;

            // 1. AUDIO — synchronous Web Audio start, must be first
            startAudioSync();

            // 2. Fullscreen — async internally but audio gesture already consumed above
            try { document.documentElement.requestFullscreen?.(); } catch (e) {}

            // 3. Visuals
            initParticles();
            animate();
            scheduleStrobe();

            // 4. UI swap
            landing.style.display = 'none';
            disco.style.display   = 'block';

            // 5. Exit blocker
            window.addEventListener('beforeunload', e => {
                e.preventDefault();
                e.returnValue = '';
            });
        }

        /* ── Single unified gesture handler — one listener, one event type ──────
         *
         *  Using ONLY touchstart (with passive:false) on mobile and click on desktop.
         *  Registering both pointerdown + touchstart + click on the same element
         *  causes multiple handler invocations per tap which can confuse the gesture
         *  token system on some iOS versions.
         *
         *  Strategy: touchstart if touch device, click otherwise. The `started` guard
         *  makes the click that fires after touchstart a safe no-op on mobile.
         * ───────────────────────────────────────────────────────────────────────── */
        startBtn.addEventListener('touchstart', function handler(e) {
            e.preventDefault();     // blocks the subsequent synthetic click on mobile
            startExperience();
        }, { passive: false, once: true });

        startBtn.addEventListener('click', function handler(e) {
            startExperience();
        }, { once: true });
    </script>
</body>
</html>
